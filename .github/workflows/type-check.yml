name: PEP 561 Type Distribution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/type-check.yml"
      - "gearmeshing_ai/types.py"
      - "gearmeshing_ai/py.typed"
      - "gearmeshing_ai/__init__.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/type-check.yml"
      - "gearmeshing_ai/types.py"
      - "gearmeshing_ai/py.typed"
      - "gearmeshing_ai/__init__.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pep561-compliance:
    name: Verify PEP 561 Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Verify type distribution sources
        run: |
          test -f gearmeshing_ai/py.typed
          test -f gearmeshing_ai/types.py
          grep -q "py.typed" pyproject.toml

      - name: Build distributions
        run: uv build --sdist --wheel

      - name: Verify type metadata in distributions
        run: |
          tar -tzf dist/*.tar.gz | grep -q "gearmeshing_ai/py.typed"
          unzip -l dist/*.whl | grep -q "gearmeshing_ai/py.typed"
          tar -tzf dist/*.tar.gz | grep -q "gearmeshing_ai/types.py"
          unzip -l dist/*.whl | grep -q "gearmeshing_ai/types.py"

  test-type-imports:
    name: Test Type Imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Install package
        run: uv sync --locked

      - name: Import public type module
        run: uv run python -c "from gearmeshing_ai import types; assert isinstance(types.__all__, list)"
